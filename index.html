<title>Bot Desk</title>
<style>
:root{--bg:#000;--card:#111114;--card2:#18181d;--line:#232329;--tx:#f5f5f7;--mut:#8e8e93;--g:#22c55e;--r:#ef4444;--b:#3b82f6;--o:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#050506;color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;font-variant-numeric:tabular-nums}
.app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:90px}
@media(min-width:480px){body{padding:20px 0;background:radial-gradient(800px 500px at 50% 0,#10251a,#050506)}.app{min-height:calc(100vh - 40px);border-radius:36px;border:1px solid #1c1c22;box-shadow:0 30px 80px #000c}}
.page{display:none;padding:18px 18px 0;animation:fi .35s ease}.page.on{display:block}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#0ea5e9);display:grid;place-items:center;font-size:16px}
.bal{font-size:44px;font-weight:700;letter-spacing:-1.5px;margin:6px 0 2px}.chg{font-size:15px;font-weight:600}.mult{margin-left:8px;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--tx);font-size:13px}
.g{color:var(--g)}.r{color:var(--r)}.mut{color:var(--mut)}.sm{font-size:12px;color:var(--mut)}
.chart{position:relative;margin:14px -18px 4px}.chart canvas{width:100%;height:170px;display:block}.live{position:absolute;top:6px;right:18px;font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:20px;background:#22c55e22;color:var(--g)}
.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);margin-right:5px;vertical-align:1px;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.2}}
h3{font-size:19px;margin:22px 0 10px;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:baseline}h3 small{font-size:12px;color:var(--mut);font-weight:400}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.ag{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:170px}
.agh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.agi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px}.agh b{font-size:16px}.st{margin-left:auto;font-size:11px;color:var(--g);background:#22c55e1a;padding:3px 8px;border-radius:10px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid #1b1b20}.kv:first-of-type{border:0}.kv span:first-child{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #1b1b20}.it:last-child{border:0}.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.it .m{flex:1;min-width:0}.it .m div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .v{text-align:right;font-weight:600}
.bg-g{background:#22c55e22;color:var(--g)}.bg-r{background:#ef444422;color:var(--r)}.bg-b{background:#3b82f622;color:var(--b)}.bg-m{background:#ffffff12;color:var(--mut)}
.pc{cursor:pointer;transition:transform .15s}.pc:active{transform:scale(.98)}
.bar{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,#ef444466,#2a2a30 50%,#22c55e66);margin:16px 0 6px}.mk{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:3px solid #000;transition:left .8s}.ent{position:absolute;top:-3px;width:2px;height:12px;background:var(--b)}
.bl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:#0b0b0dee;backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 0 max(14px,env(safe-area-inset-bottom));z-index:5}
@media(min-width:480px){.tabs{bottom:20px;border-radius:0 0 36px 36px}}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}.tabs button.on{color:var(--g)}.tabs svg{width:24px;height:24px}
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:396px;z-index:20;pointer-events:none}

.err{display:none;margin:10px 0 0;background:#3a1418;border:1px solid #7f1d1d;color:#fecaca;padding:9px 12px;border-radius:14px;font-size:12px}
.det{position:fixed;inset:0;z-index:10;display:none;overflow:auto;background:#050506}.det.on{display:block;animation:sl .3s ease}@keyframes sl{from{transform:translateX(40px);opacity:0}}
.det .app{padding:18px}.back{background:var(--card2);border:0;color:var(--tx);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.sol{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:10px;background:linear-gradient(90deg,#9945ff33,#14f19533);color:#c4b5fd}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mx div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px}.mx b{display:block;font-size:17px;margin-top:2px}
#cc{width:100%;height:260px;display:block}.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;background:var(--card2);border:0;color:var(--mut);border-radius:10px;padding:6px;font:inherit;font-size:12px;cursor:pointer}.seg button.on{background:#22c55e22;color:var(--g)}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:#ffffff12;color:var(--mut);margin-left:6px;font-weight:500}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ---------- line chart ---------- */
function line(cv,vs,base){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;const x=cv.getContext("2d");x.scale(r,r);
 if(vs.length<2){x.fillStyle="#8e8e93";x.font="12px sans-serif";x.textAlign="center";x.fillText("Collecting live samples… (every 30s)",w/2,h/2);$("chi").textContent="";if(vs.length<1)return;vs=[vs[0],vs[0]]}
 let lo=Math.min(...vs,base??Infinity),hi=Math.max(...vs,base??-Infinity);if(hi-lo<.1){hi+=.05;lo-=.05}const X=i=>i/(vs.length-1)*w,Y=v=>h-12-(v-lo)/(hi-lo)*(h-34);
 const up=vs[vs.length-1]>=(base??vs[0]),col=up?"#22c55e":"#ef4444";
 if(base!=null){x.strokeStyle="#ffffff22";x.setLineDash([3,5]);x.beginPath();x.moveTo(0,Y(base));x.lineTo(w,Y(base));x.stroke();x.setLineDash([])}
 x.beginPath();vs.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(0,Y(v)));x.strokeStyle=col;x.lineWidth=2.4;x.lineJoin="round";x.stroke();
 const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,col+"44");g.addColorStop(1,col+"00");x.lineTo(w,h);x.lineTo(0,h);x.fillStyle=g;x.fill();
 x.beginPath();x.arc(X(vs.length-1)-3,Y(vs[vs.length-1]),4,0,7);x.fillStyle=col;x.fill();
 if(cv.id==="ch"){const H=LS.get("solbot_hist",[]);if(H.length>1)$("chi").textContent=`${H.length} samples since ${bxt(H[0][0])} · dashed = $18 start`}}

function openCoin(m){detMint=m;ohlc=null;$("det").classList.add("on");detPanel(m);loadOhlc()}

async function loadOhlc(){const m=detMint,o=SNAP.open.find(x=>x.mint===m),pool=PR()[m]?.pool||o.pool;
 try{const r=await fetch(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${pool}/ohlcv/minute?aggregate=${tf}&limit=200`);if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();if(m!==detMint)return;ohlc=j.data.attributes.ohlcv_list.map(c=>({t:c[0]*1000,o:+c[1],h:+c[2],l:+c[3],c:+c[4]})).sort((a,b)=>a.t-b.t);drawCandles()}
 catch(e){ohlc="err";drawCandles();$("ccn").textContent="Candles unavailable ("+e.message+") — showing session price line"}}
function drawCandles(){const cv=$("cc");if(!cv)return;const o=SNAP.open.find(x=>x.mint===detMint),r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;const x=cv.getContext("2d");x.scale(r,r);
 if(!ohlc){x.fillStyle="#8e8e93";x.font="12px sans-serif";x.textAlign="center";x.fillText("Loading candles…",w/2,h/2);return}
 if(ohlc==="err"){const p=PR()[detMint]?.price;line(cv,p?[o.entry,p]:[o.entry,o.entry],o.entry);return}
 const C=ohlc,R=44,lo=Math.min(o.stop,...C.map(c=>c.l))*.98,hi=Math.max(o.tp,...C.map(c=>c.h))*1.02,Y=v=>8+(hi-v)/(hi-lo)*(h-24),cw=(w-R)/C.length,X=i=>i*cw+cw/2;
 x.font="10px sans-serif";x.fillStyle="#555";for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;x.fillText(v.toPrecision(3),w-R+4,Y(v)+3);x.fillStyle="#1b1b20";x.fillRect(0,Y(v),w-R,1);x.fillStyle="#555"}
 const hl=(v,col,dash,lab)=>{x.strokeStyle=col;x.setLineDash(dash);x.lineWidth=1.2;x.beginPath();x.moveTo(0,Y(v));x.lineTo(w-R,Y(v));x.stroke();x.setLineDash([]);x.fillStyle=col;x.fillText(lab,4,Y(v)-4)};
 hl(o.stop,"#f59e0b",[4,4],"STOP "+px(o.stop));hl(o.tp,"#22c55e",[],"TP "+px(o.tp));
 C.forEach((c,i)=>{const up=c.c>=c.o,col=up?"#22c55e":"#ef4444";x.strokeStyle=col;x.fillStyle=col;x.beginPath();x.moveTo(X(i),Y(c.h));x.lineTo(X(i),Y(c.l));x.lineWidth=1;x.stroke();
  const bw=Math.max(1,cw*.65);x.fillRect(X(i)-bw/2,Y(Math.max(c.o,c.c)),bw,Math.max(1,Math.abs(Y(c.o)-Y(c.c))))});
 const et=o.entry_t*1000,step=tf*6e4;let ei=C.findIndex(c=>et>=c.t&&et<c.t+step);if(ei<0&&et<C[0].t)ei=-1;
 if(ei>=0){const ex=X(ei),ey=Y(o.entry);x.fillStyle="#3b82f6";x.beginPath();x.arc(ex,ey,6,0,7);x.fill();x.strokeStyle="#000";x.lineWidth=2;x.stroke();x.fillStyle="#3b82f6";x.font="bold 10px sans-serif";x.fillText("BUY",Math.min(ex+9,w-R-24),ey+3)}
 else{x.fillStyle="#3b82f6";x.fillText("◀ BUY "+px(o.entry)+" (before window)",4,Y(o.entry)+3)}
 const last=C[C.length-1];x.fillStyle="#fff";x.fillRect(w-R,Y(last.c)-7,R,14);x.fillStyle="#000";x.fillText(last.c.toPrecision(3),w-R+3,Y(last.c)+3)}
